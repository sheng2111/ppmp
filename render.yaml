services:
  - type: web
    name: ppmp-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: ppmp_system
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://ppmp-mauve.vercel.app
