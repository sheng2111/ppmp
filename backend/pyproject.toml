[project]
name = "e-pms-backend"
version = "2.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.136.3",
    "uvicorn[standard]==0.49.0",
    "beanie==1.29.0",
    "motor==3.6.0",
    "pymongo==4.9.2",
    "python-dotenv==1.2.2",
    "python-multipart==0.0.32",
    "openpyxl==3.1.5",
    "reportlab==5.0.0",
    "pydantic==2.13.4",
    "certifi==2024.8.30",
]

[tool.vercel]
entrypoint = "app.main:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]